[workspace]

[package]
name = "sovereign-capability-ui-harness"
version = "0.0.0"
edition = "2021"
publish = false

# Nested workspace so compile-fail bins are invisible to parent clippy
# `--all-targets`. Cargo.lock versions must be a subset of the repo
# workspace lock: CI fetches only that graph, and these checks run
# `--offline --locked`.

[dependencies.sovereign-capability]
path = "../../.."
default-features = false

[dependencies.serde]
version = "1"
features = ["derive"]

[[bin]]
name = "trybuild000"
path = "../cannot_construct_verified_capability.rs"

[[bin]]
name = "trybuild001"
path = "../cannot_clone_debug_or_serialize_verified_capability.rs"

[[bin]]
name = "trybuild002"
path = "../cannot_construct_verified_approval.rs"

[[bin]]
name = "trybuild003"
path = "../cannot_clone_debug_or_serialize_verified_approval.rs"
