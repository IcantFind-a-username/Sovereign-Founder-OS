[package]
name = "sovereign-capability"
description = "Capability token issuer and validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Empty forwarding hook so authority's `owner-effect-fixture` can name this
# crate's same feature after the Task 10 graph inversion. No code is gated
# here yet; the feature exists so Cargo can forward it without a cycle.
owner-effect-fixture = []

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-identity = { workspace = true }
sovereign-artifact = { workspace = true }
sovereign-policy = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
serde_json_canonicalizer = { workspace = true }

[dev-dependencies]
# Pin matches crates/vault-v2-engine. trybuild 1.0.116 + Cargo 1.97 treats
# compile-fail cases as success, so tests/ui.rs drives cargo check itself;
# the crate is listed to keep the reviewed pin in this package graph.
trybuild = "=1.0.116"
static_assertions = "=1.1.0"
