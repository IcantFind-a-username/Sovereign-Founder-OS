[package]
name = "sovereign-capability"
description = "Capability token issuer and validator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Fixture-only closed RFC 0002 Amendment 1 profile issuance. Product
# Capability V2 issuance stays `pure_compute`; this feature never enters
# sovereign-cli's default/release graph.
owner-effect-fixture = ["sovereign-artifact/owner-effect-fixture"]

[[test]]
name = "closed_profile_issuance"
path = "tests/closed_profile_issuance.rs"
required-features = ["owner-effect-fixture"]

[dependencies]
sovereign-contracts = { workspace = true }
sovereign-identity = { workspace = true }
sovereign-artifact = { workspace = true }
sovereign-policy = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
serde_json_canonicalizer = { workspace = true }

[dev-dependencies]
# Pin matches crates/vault-v2-engine. trybuild 1.0.116 + Cargo 1.97 treats
# compile-fail cases as success, so tests/ui.rs drives cargo check itself;
# the crate is listed to keep the reviewed pin in this package graph.
trybuild = "=1.0.116"
static_assertions = "=1.1.0"
