[package]
name = "sovereign-synthetic-owner-effect"
description = "Release-excluded single-process synthetic owner-effect fixture (Wave D). Not a product path."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Never published. This is the v2 upper fixture process, not product packaging.
publish = false
# Explicit targets only: a file dropped into src/bin must not become a second
# listener or a hidden child by auto-discovery.
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
name = "sovereign_synthetic_owner_effect"
path = "src/lib.rs"

[[bin]]
name = "sovereign-synthetic-owner-effect"
path = "src/main.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "single_process_boundary"
path = "tests/single_process_boundary.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "unqualified_uv_sessions"
path = "tests/unqualified_uv_sessions.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "signer_epoch"
path = "tests/signer_epoch.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "cross_port_residuals"
path = "tests/cross_port_residuals.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "exact_uv_approval"
path = "tests/exact_uv_approval.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "reserve_atomicity"
path = "tests/reserve_atomicity.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "reserve_races"
path = "tests/reserve_races.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "reserve_kill"
path = "tests/reserve_kill.rs"
required-features = ["owner-effect-fixture"]

[[test]]
name = "reserve_compile_fail"
path = "tests/reserve_compile_fail.rs"
required-features = ["owner-effect-fixture"]

[dependencies]
sovereign-authority = { workspace = true }
sovereign-capability = { workspace = true }
sovereign-identity = { workspace = true, optional = true }
sovereign-owner = { workspace = true, optional = true }
sovereign-artifact = { workspace = true, optional = true }
sovereign-policy = { workspace = true, optional = true }
sovereign-contracts = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
redb = { version = "=4.1.0", optional = true }
uuid = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde_json_canonicalizer = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
uuid = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
static_assertions = "=1.1.0"
sovereign-identity = { workspace = true }
sovereign-authority = { workspace = true }
sovereign-capability = { workspace = true }
sovereign-artifact = { workspace = true }
sovereign-policy = { workspace = true }

[features]
# Empty default so a workspace build cannot unify owner-effect-fixture into
# sovereign-cli. The crate *is* the fixture; the feature exists so Cargo's
# additive unification cannot smuggle it into a product graph.
default = []
owner-effect-fixture = [
    "sovereign-authority/owner-effect-fixture",
    "sovereign-owner/owner-effect-fixture",
    "sovereign-capability/owner-effect-fixture",
    "dep:sovereign-identity",
    "dep:sovereign-owner",
    "dep:sovereign-artifact",
    "dep:sovereign-policy",
    "dep:sovereign-contracts",
    "dep:chrono",
    "dep:redb",
    "dep:uuid",
    "dep:hex",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_json_canonicalizer",
    "dep:rand",
]
