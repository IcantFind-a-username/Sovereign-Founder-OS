[package]
name = "sovereign-authority"
description = "Durable one-use authority consumption for Sovereign Runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Never default, and never forwarded by any shipping crate's features. The
# fault-injection module compiles only under this flag, so a default build
# contains neither the barrier names nor the environment variable that selects
# one. scripts/check-fault-injection-excluded.sh proves that against the real
# release artifact rather than trusting this comment.
default = []
fault-injection = []
# RFC 0006's synthetic broker. Non-default for the same reason: a default
# build must contain no broker mode and no entry point.
owner-effect-fixture = []

[dependencies]
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
sovereign-fault-testing = { path = "../fault-testing" }
tempfile = "3"

# Only meaningful with the barrier compiled in; without the feature the test
# would reference a module that does not exist.
[[test]]
name = "subprocess_claims"
required-features = ["fault-injection"]

[[test]]
name = "broker_bootstrap_frame"
required-features = ["owner-effect-fixture"]
