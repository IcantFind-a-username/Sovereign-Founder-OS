[package]
name = "sovereign-privacy"
description = "Data-sovereignty boundary: trusted values, registered transforms, and the compiler that is the only way to build a public-compute job"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# RFC 0004: this crate must not depend on the model gateway, the policy
# engine, workflow, UI, or any provider networking. Those may depend on it.
# Nothing here opens a socket.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Pin matches crates/capability. trybuild 1.0.116 + Cargo 1.97 treats
# compile-fail cases as success, so tests/ui.rs drives cargo check itself;
# the crate is listed to keep the reviewed pin in this package graph.
trybuild = "=1.0.116"
