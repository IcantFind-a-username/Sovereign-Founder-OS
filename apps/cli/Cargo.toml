[package]
name = "sovereign-cli"
description = "CLI for Sovereign Runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "sovereign"
path = "src/main.rs"

[features]
default = []
# Explicit forwarding, so the only way the CLI gains a broker mode is by
# someone naming it here. Cargo features are additive, so this edge is the
# thing scripts/check-fault-injection-excluded.sh's sibling check watches.
owner-effect-fixture = ["sovereign-authority/owner-effect-fixture"]
# Only for the kill matrix: barriers live in authority behind its own flag.
fault-injection = ["sovereign-authority/fault-injection"]

[dependencies]
sovereign-artifact = { workspace = true }
sovereign-audit-ledger = { workspace = true }
sovereign-authority = { workspace = true }
sovereign-capability = { workspace = true }
sovereign-consultant-playground = { workspace = true }
sovereign-contracts = { workspace = true }
sovereign-effects = { workspace = true }
sovereign-execution = { workspace = true }
sovereign-identity = { workspace = true }
sovereign-model = { workspace = true }
sovereign-policy = { workspace = true }
sovereign-privacy = { workspace = true }
sovereign-sandbox = { workspace = true }
sovereign-vault = { workspace = true }
sovereign-workflow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
serde_json_canonicalizer = { workspace = true }
tiny_http = "0.12"
uuid = { workspace = true }
wat = "1"

[dev-dependencies]
tempfile = "3"
httparse = { version = "=1.10.1", default-features = false }

[[test]]
name = "broker_kill_matrix"
required-features = ["owner-effect-fixture", "fault-injection"]
